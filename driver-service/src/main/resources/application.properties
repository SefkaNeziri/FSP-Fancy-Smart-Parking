spring.application.name=driver-service
server.port=8080

# --- Supabase PostgreSQL (transaction pooler) ---
# prepareThreshold=0  -> pooler in transaction mode does not support prepared statements
# stringtype=unspecified -> lets us save Java Strings into PostgreSQL ENUM columns (spot_status, reservation_status...)
spring.datasource.url=jdbc:postgresql://aws-1-eu-central-1.pooler.supabase.com:6543/postgres?prepareThreshold=0&stringtype=unspecified
spring.datasource.username=postgres.mhxlhsvjxrjvcndkbhfi
spring.datasource.password=gb8JK3weNu9
spring.datasource.hikari.maximum-pool-size=5

# --- JPA ---
# The database already exists, so Hibernate must NOT change tables
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

